name: ETS2 TruckersMP test IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: truckersmp-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      MADEIRA_BUILD_JOBS: '2'
      TMPDIR: ${{ github.workspace }}/TMP/
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/TMP/clang-modules
      CCACHE_DIR: ${{ github.workspace }}/TMP/ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare workspace and Xcode
        id: xcode
        shell: bash
        run: |
          mkdir -p TMP
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          echo "version=$(printf '%s\n' "$xcode_version" | tr '\n' '-' | tr ' ' '_')" >> "$GITHUB_OUTPUT"
          major="$(printf '%s\n' "$xcode_version" | awk '/^Xcode / {split($2, parts, "."); print parts[1]}')"
          [ "$major" -ge 27 ] || { echo 'Xcode 27 or newer is required'; exit 1; }
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          [ "${ios_sdk%%.*}" -ge 27 ] || { echo "iOS 27 SDK required; found $ios_sdk"; exit 1; }
          if ! xcrun -sdk macosx metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
      - name: Install build tools
        run: brew install cmake ninja meson bison flex pkg-config ccache llvm
      - name: Check winemetal against iPhone SDK
        run: |
          python3 build/truckersmp/patch-dxmt.py
          xcrun --sdk iphoneos clang -fsyntax-only -x objective-c -fblocks \
            -arch arm64 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=18.0 \
            -Ibuild -Iresearch -Idxmt/include -Idxmt/libs \
            -Idxmt/src/winemetal -Idxmt/src/airconv \
            dxmt/src/winemetal/unix/winemetal_unix.c
      - name: Check AIR shaders against Metal compiler
        run: |
          for shader in air_msad air_samplepos air_tessellation; do
            xcrun --sdk macosx metal -c "dxmt/src/airconv/shaders/$shader.metal" \
              -std=metal3.1 --target=air64-apple-macos14.0 -o "TMP/$shader.air"
          done
      - name: Test startup hook
        run: |
          clang -std=c11 -Wall -Wextra -Werror tests/truckersmp-startup.c -o TMP/startup-test
          TMP/startup-test
          clang -std=c11 -Wall -Wextra -Werror tests/truckersmp-args.c -o TMP/args-test
          TMP/args-test
          clang -std=c11 -Wall -Wextra -Werror tests/truckersmp-env.c -o TMP/env-test
          TMP/env-test
      - name: Check Wine diagnostics against iPhone SDK
        run: python3 tests/wine-process-diagnostics.py "$PWD/TMP" iphoneos
      - name: Test native FEX diagnostics
        run: python3 tests/fex-native-diagnostics.py "$PWD/TMP"
      - name: Test ETS2 folder import
        run: |
          swiftc app/Madeira/SteamKeyValues.swift app/Madeira/ETS2Import.swift tests/ets2-import.swift -o TMP/import-test
          TMP/import-test "$PWD/TMP"
      - name: Record native source pins
        id: pins
        shell: bash
        run: |
          revision="$(git ls-tree HEAD FEX wine dxmt madeira-dock | shasum -a 256 | cut -d' ' -f1)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Cache native runtime
        uses: actions/cache/restore@v4
        id: native
        with:
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.pins.outputs.revision }}-${{ hashFiles('build/**/*.sh', 'build/truckersmp/**', 'build/**/*.c', 'build/**/*.h') }}
          path: |
            FEX/build-ios
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/llvm-ios-build/lib
            build/freetype-ios/build
            app/Madeira/lib*.a
            app/Madeira/arm64ec-windows/ntdll.dll
            app/Madeira/arm64ec-windows/kernelbase.dll
            app/Madeira/arm64ec-windows/dockhost.exe
            app/Madeira/arm64ec-windows/dock-notices.txt
      - name: Restore LLVM build cache
        # Keep LLVM independent of Wine/app fixes and preserve partial builds.
        # Bump llvm-v3 when changing the pinned LLVM configuration.
        # The native cache still supplies the final app archives on a hit.
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: llvm
        with:
          key: llvm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-8dfdcc7b7
          # Reconfigure the previous partial build to retain its compiled objects.
          restore-keys: |
            llvm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-8dfdcc7b7
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
      - name: Compile native runtime
        if: steps.native.outputs.cache-hit != 'true'
        run: bash build/truckersmp/prepare-native.sh 2>&1 | tee TMP/native-build.log
      - name: Save LLVM progress
        if: always() && steps.llvm.outcome == 'success' && steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.llvm.outputs.cache-primary-key }}
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
      - name: Save native runtime
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.native.outputs.cache-primary-key }}
          path: |
            FEX/build-ios
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/llvm-ios-build/lib
            build/freetype-ios/build
            app/Madeira/lib*.a
            app/Madeira/arm64ec-windows/ntdll.dll
            app/Madeira/arm64ec-windows/kernelbase.dll
            app/Madeira/arm64ec-windows/dockhost.exe
            app/Madeira/arm64ec-windows/dock-notices.txt
      - name: Verify and stage supplied ETS2 files
        run: python3 build/truckersmp/unpack-payload.py
      - name: Build iPhone app
        shell: bash
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          bash build/stage-licenses.sh
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/TMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee TMP/xcode-build.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p TMP/package/Payload
          ditto TMP/DerivedData/Build/Products/Debug-iphoneos/Madeira.app TMP/package/Payload/Madeira.app
          test -f TMP/package/Payload/Madeira.app/TruckersMP/core_ets2mp.dll
          test -f TMP/package/Payload/Madeira.app/arm64ec-windows/dockhost.exe
          test ! -e TMP/package/Payload/Madeira.app/TruckersMP/core_atsmp.dll
          test ! -d TMP/package/Payload/Madeira.app/TruckersMP/data/ats
          ditto -c -k --keepParent TMP/package/Payload TMP/TruckersMP-ETS2-test-unsigned.ipa
          shasum -a 256 TMP/TruckersMP-ETS2-test-unsigned.ipa > TMP/TruckersMP-ETS2-test-unsigned.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TruckersMP-ETS2-test-unsigned
          path: |
            TMP/TruckersMP-ETS2-test-unsigned.ipa
            TMP/TruckersMP-ETS2-test-unsigned.ipa.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            TMP/*.log
            build/**/*.err
            build/**/*.log
            build/**/err-*.txt
            wine/build-macos/config.log
            wine/build-arm64ec/config.log
            FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
